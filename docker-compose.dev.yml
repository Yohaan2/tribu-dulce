services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tribu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tribu123}
      POSTGRES_DB: ${POSTGRES_DB:-tribu_dulce}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tribu}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
