upstream nextjs_app {
    server app:3000;
}

# Redirige todo el tráfico HTTP a HTTPS, excepto los desafíos de Let's Encrypt
server {
    listen 80;
    server_name tribu-dulce.shop;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS con certificados de Let's Encrypt
server {
    listen 443 ssl;
    server_name tribu-dulce.shop;

    # Tamaño máximo de cuerpo de solicitud
    client_max_body_size 10M;

    # Certificados SSL
    ssl_certificate /etc/letsencrypt/live/tribu-dulce.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tribu-dulce.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Cabeceras de seguridad básicas
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Assets estáticos de Next.js — cacheados en el cliente por 1 año
    location /_next/static/ {
        proxy_pass http://nextjs_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Archivos públicos
    location /static/ {
        proxy_pass http://nextjs_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }

    # Resto del tráfico → Next.js
    location / {
        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }
}
