upstream nextjs_app {
    server app:3000;
}

# Redirige todo el tráfico HTTP a HTTPS, excepto los desafíos de Let's Encrypt
server {
    listen 80;
    server_name tribu-dulce.shop;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS con certificados de Let's Encrypt
server {
    listen 443 ssl http2;
    server_name tribu-dulce.shop;

    # Tamaño máximo de cuerpo de solicitud
    client_max_body_size 10M;

    # Ocultar versión de nginx
    server_tokens off;

    # Certificados SSL
    ssl_certificate /etc/letsencrypt/live/tribu-dulce.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tribu-dulce.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Cabeceras de seguridad básicas
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 60s;

    # Assets estáticos de Next.js — cacheados en el cliente por 1 año
    location /_next/static/ {
        proxy_pass http://nextjs_app;
        proxy_set_header Host $host;
    }

    # Archivos públicos
    location /static/ {
        proxy_pass http://nextjs_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }

    # Resto del tráfico → Next.js
    location / {
        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_cache_bypass $http_upgrade;
    }
}

